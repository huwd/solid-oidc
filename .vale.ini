# Advisory prose checks, run locally with `pnpm run docs:prose` (not in CI or
# `pnpm run check`). StylesPath comes from the devenv wrapper in nix/vale.nix.
MinAlertLevel = suggestion
Vocab = House

[*.md]
BasedOnStyles = Vale, House, write-good, proselint

# Superseded by House.Spelling (en_GB)
Vale.Spelling = NO
# Flags every "is"/"are": noise, not advice
write-good.E-Prime = NO
# US-centric; flags British forms as "inconsistent"
proselint.Spelling = NO
